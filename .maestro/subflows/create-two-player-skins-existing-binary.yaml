# Existing-binary variant of create-two-player-skins.yaml, scoped to AUG-637 reruns only.
# The pinned EAS artifact 6a97486c-6f45-42cd-ad09-27d959395fb4 predates the AUG-612 iOS a11y
# childOf fix, so the game-mode-skins accessibility id never mounts on it (confirmed against the
# retained 2026-11-14 capture in .maestro/fixtures/retained-20261114/, see
# tests/e2e-existing-binary-selectors.test.cjs). Falls back to the unique "Skins" label text.
# Never used by the online/offline build flows: those keep the id-based tap (AUG-1105) for
# current and future builds, which do mount the id.
appId: com.scoresnap.app
---
- tapOn:
    id: "home-new-contest"
- extendedWaitUntil:
    visible: "Your name"
    timeout: 15000
# Player 1 may be prefilled with the local profile name (offline build shows "Golfer"); replace it.
- tapOn:
    text: "Your name|Golfer.*"
    index: 0
- eraseText: 30
- inputText: "Ava"
# iOS hideKeyboard is unreliable here; the form uses keyboardShouldPersistTaps="handled", so tapping a label dismisses it.
- tapOn: "PLAYERS"
- tapOn: "Player 2 name"
- inputText: "Ben"
- tapOn: "PLAYERS"
- assertVisible: "Ava"
- assertVisible: "Ben"
- tapOn:
    text: "Continue"
    index: 0
# No accessibility id on this build; "^Skins$" is anchored so it cannot match the sibling
# "Skins (Carryover)" card.
- extendedWaitUntil:
    visible: "^Skins$"
    timeout: 15000
- tapOn: "^Skins$"
- assertVisible:
    text: "^Skins$"
    selected: true
- scrollUntilVisible:
    element: "Continue"
    direction: DOWN
    optional: true
- tapOn:
    text: "Continue"
    index: 0
- scrollUntilVisible:
    element: "Start"
    direction: DOWN
    optional: true
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Settlement"
    timeout: 20000
