# AUG-315 / AUG-402: offline first-launch export of frozen settled Unicode round.
# The adapter saves locally before opening the share sheet; the runner reopens/copies that cache file, never sends it.
appId: com.scoresnap.app
---
- launchApp:
    clearState: false
    permissions: { all: allow }
- runFlow: ../../subflows/finish-onboarding.yaml
- tapOn: "E2E PDF Unicode Round"
- tapOn: "Settlement"
- assertVisible: "Zoë Łukasz"
- assertVisible: "Δημήτρης"
- assertVisible: "Алексей"
- scrollUntilVisible:
    element: "Export scorecard \\(PDF\\)"
    direction: DOWN
- takeScreenshot: aug-315-01-export-button
- tapOn: "Export scorecard \\(PDF\\)"
- extendedWaitUntil:
    visible: ".*(Save to Files|Copy|PDF Document|\\.pdf).*"
    timeout: 30000
- takeScreenshot: aug-315-02-share-sheet-pdf
- assertNotVisible: ".*(Could not|failed|Unsupported).*"
