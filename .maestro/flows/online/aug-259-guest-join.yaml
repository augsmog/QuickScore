# AUG-259: a signed-out fresh device opens the DGTWEW join link and gets a guest join (no account), on the production backend.
# liveWrite: submits one anonymous guest join for round DGTWEW (this is the ticket's acceptance).
appId: com.scoresnap.app
env:
  JOIN_CODE: DGTWEW
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- extendedWaitUntil:
    visible: "Skip|Next|Get Started|.*See Who Owes What.*"
    timeout: 60000
# Cold start can swallow the link while the auth/onboarding gate mounts; retry the open (same link, no extra writes).
- retry:
    maxRetries: 3
    commands:
      - openLink: "snapscore://join/${JOIN_CODE}"
      - tapOn:
          text: "Open"  # iOS asks 'Open in "SnapScore"?' for a custom-scheme link
          optional: true
      - extendedWaitUntil:
          visible: "Join with code"
          timeout: 20000
- takeScreenshot: aug-259-01-join-screen-signed-out
- tapOn: "Join code"
- eraseText: 10
- inputText: "${JOIN_CODE}"
- tapOn: "Display name"
- inputText: "Tater E2E"
# iOS hideKeyboard fails on this RN screen; Find contest stays visible above the keyboard.
- takeScreenshot: aug-259-02-code-and-name-entered
- tapOn: "Find contest"
- extendedWaitUntil:
    visible: ".*(Request sent|Playing as|Leaderboard|Your scores|approve).*"
    timeout: 30000
- takeScreenshot: aug-259-03-after-join
- assertNotVisible: ".*(not found|failed|Error|error).*"
