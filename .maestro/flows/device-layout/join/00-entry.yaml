# device-layout Join — checkpoint 00: the Home join-code entry.
# Join by code is flag-gated (CROSS_DEVICE_SHARING_ENABLED / EXPO_PUBLIC_FEATURE_CROSS_DEVICE_SHARING).
# SnapScore 1.0.1 ships with it ON, and the gate's build sets it on too (DEVICE_LAYOUT_JOIN_FLAG in
# the workflow), so the Home captured here is the Home that ships. Assert the entry is present: a
# gate build that lost the flag would otherwise pass while capturing a Home nobody will see.
appId: com.scoresnap.app
---
- launchApp:
    clearState: true
    permissions: { all: allow }
- runFlow: ../../../subflows/finish-onboarding.yaml
- assertVisible:
    id: "home-join-code"
- assertVisible:
    id: "home-new-contest"
- takeScreenshot: device-layout-join-00-entry
