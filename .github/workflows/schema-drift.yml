name: Schema drift
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# Avoid public.ecr.aws anonymous pull throttling on shared GitHub runners.
env:
  SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
jobs:
  schema-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scoresnap
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute Supabase image cache key
        continue-on-error: true
        id: img-key
        run: |
          version=$(supabase --version)
          echo "key=supabase-images-v1-${{ runner.os }}-cli${version}-${{ hashFiles('scoresnap/supabase/config.toml') }}" >> "$GITHUB_OUTPUT"
      - name: Restore Supabase image cache
        continue-on-error: true
        id: img-cache
        if: steps.img-key.outputs.key != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/supabase-images
          key: ${{ steps.img-key.outputs.key }}
      - name: Load Supabase image cache
        continue-on-error: true
        env:
          CACHE_HIT: ${{ steps.img-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = true ]; then
            echo "supabase image cache: HIT"
          else
            echo "supabase image cache: MISS"
          fi
          bash scripts/ci/supabase-start-cached.sh load "${{ runner.temp }}/supabase-images"
      - name: Start pinned PostgreSQL 17 stack and reset migration chain
        run: bash scripts/ci/supabase-start-cached.sh start -x vector,logflare,studio,imgproxy,mailpit
      - name: Save Supabase images
        continue-on-error: true
        if: steps.img-key.outputs.key != '' && steps.img-cache.outputs.cache-hit != 'true'
        id: img-save
        run: |
          bash scripts/ci/supabase-start-cached.sh save "${{ runner.temp }}/supabase-images"
          if [[ -f "${{ runner.temp }}/supabase-images/images.tar.zst" || -f "${{ runner.temp }}/supabase-images/images.tar.gz" ]]; then
            echo "saved=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save Supabase image cache
        continue-on-error: true
        if: steps.img-key.outputs.key != '' && steps.img-cache.outputs.cache-hit != 'true' && steps.img-save.outputs.saved == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/supabase-images
          key: ${{ steps.img-key.outputs.key }}
      - name: Reset migration chain
        run: |
          supabase db reset
      - name: Emulate hosted platform-provided defaults and extensions (never live)
        run: psql postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres -X -v ON_ERROR_STOP=1 -f supabase/schema-drift/platform-emulation.sql
      - name: M1 baseline parity, ledger and mutation gates; M2 foundation, rollback, role and compatibility gates
        run: bash supabase/schema-drift/verify-foundation-ci.sh

      - name: Rehearse live ledger adoption without executing baseline twice
        run: bash supabase/schema-drift/rehearse-ledger-adoption.sh
      - name: Stop local stack
        if: always()
        run: supabase stop

  m4b-native-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from PGDG
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-17
      - name: Full M4b SQL chain, role matrix, mutations and synchronized races
        run: |
          /usr/lib/postgresql/17/bin/postgres --version | grep -E 'PostgreSQL\) 17\.'
          bash scoresnap/supabase/schema-drift/m4b-local.sh
