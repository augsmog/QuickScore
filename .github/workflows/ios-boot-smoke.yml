name: iOS boot smoke
on:
  push:
    branches: [main]
  # CI trim 2026-10-30 (Augie yes 4:21 PM PT): PRs run this suite only when files it tests change.
  # Main pushes and manual runs are unfiltered.
  pull_request:
    paths:
      - 'scoresnap/app/**'
      - 'scoresnap/src/**'
      - 'scoresnap/assets/**'
      - 'scoresnap/package.json'
      - 'scoresnap/package-lock.json'
      - 'scoresnap/app.json'
      - 'scoresnap/babel.config.js'
      - 'scoresnap/metro.config.js'
      - 'scoresnap/tsconfig.json'
      - 'scoresnap/index.ts'
      - 'scoresnap/global.css'
      - 'scoresnap/tailwind.config.js'
      - 'scoresnap/nativewind-env.d.ts'
      - 'scoresnap/.npmrc'
      - 'scoresnap/pnpm-lock.yaml'
      - 'scoresnap/supabase/functions/**'
      - 'docs/xdevice/**'
      - 'scoresnap/eas.json'
      - 'scoresnap/e2e/ios-boot-smoke.cjs'
      - '.github/workflows/ios-boot-smoke.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  ios-boot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scoresnap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoresnap/package-lock.json
      - run: npm ci
      - run: npm run smoke:ios
