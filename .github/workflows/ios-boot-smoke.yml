name: iOS boot smoke
on: [pull_request, push]
permissions:
  contents: read
jobs:
  ios-boot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scoresnap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoresnap/package-lock.json
      - run: npm ci
      - run: npm run smoke:ios
