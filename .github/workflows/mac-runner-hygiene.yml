name: mac-runner-hygiene
# AUG-1484. Keeps the Mac mini self-hosted runner (self-hosted, ios-sim) up and with disk to spare, unattended.
# Owner: t1585u (no approval needed for runner hygiene), t1589u/t1590u ("Jobs not starting isn't the answer, alerting
# and freeing up disc space so they can run is"; the system keeps the Mac up without bothering Augie).
# Hourly on the Mac:
#   1. emergency cleanup before checkout (a full disk breaks checkout itself)
#   2. install/refresh .github/mac-runner: runner job hooks (never refuse a job; escalating cleanup below the floor),
#      caffeinate KeepAlive agent, 2-min watchdog (runner service + remote-access app), 30-min sim/disk sweep,
#      runner plist RunAtLoad+KeepAlive
#   3. proactive cleanup (starts at 60 GB free, well before the 25 GB floor)
#   4. publish heartbeat/cleanup/alerts to the "Mac runner status" issue (edited in place; labels carry state)
# Never fails on disk: low space is cleaned and recorded, not turned into a red run or a page.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  # AUG-1601: the pull_request trigger is removed; no workflow may start from a push or a pull
  # request. The hourly schedule stays: this and mac-runner-watch are the only automatic cleaning
  # and watching of the Mac, and are named in scoresnap/scripts/ci/workflow-triggers-lint.cjs.
permissions:
  contents: read
  issues: write
concurrency:
  group: mac-runner-hygiene
  cancel-in-progress: false
jobs:
  hygiene:
    # Public repo: never run fork PR code on the self-hosted Mac.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ios-sim]
    timeout-minutes: 30
    steps:
      - name: Emergency cleanup before checkout
        shell: bash
        run: |
          f=$(df -g /System/Volumes/Data | awk 'NR==2{print $4}'); echo "free before: $f GB"
          if [ "$f" -lt 25 ]; then
            xcrun simctl shutdown all || true; xcrun simctl delete unavailable || true
            rm -rf "$HOME/Library/Developer/Xcode/DerivedData/"* "$HOME/Library/Developer/CoreSimulator/Caches/"* 2>/dev/null || true
            echo "free after emergency step: $(df -g /System/Volumes/Data | awk 'NR==2{print $4}') GB"
          fi
      # Persistent workspace + dangling gitlink (august-industries-site): skip clean + submodules.
      - uses: actions/checkout@v4
        with:
          clean: false
          submodules: false
          sparse-checkout: .github/mac-runner
      - name: Install/refresh keep-up + hygiene guard
        shell: bash
        run: bash .github/mac-runner/install.sh
      - name: Proactive cleanup
        shell: bash
        run: bash "$HOME/aos-mac-hygiene/sim-guard.sh" hygiene && bash "$HOME/aos-mac-hygiene/sim-guard.sh" watchdog
      - name: Publish status board
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 .github/mac-runner/status.py publish
