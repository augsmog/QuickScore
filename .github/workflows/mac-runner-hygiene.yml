name: mac-runner-hygiene
# AUG-1484. Keeps the Mac mini self-hosted runner (self-hosted, ios-sim) healthy unattended.
# Augie t1585u (Nov 21 2026): runner hygiene needs no approval. 9:19 AM ET Nov 21: a dozen phone emulators were open
# after a reboot; "There needs to be better hygiene."
# Root cause it prevents: device-layout-gate run 44705203332 attempt 2 died with "No space left on device".
#
# Each run (every 3 h, on demand, and on PRs that touch it):
#   1. emergency cleanup BEFORE checkout (a full disk breaks checkout itself)
#   2. installs/refreshes .github/mac-runner: runner job-started/job-completed hooks (enforced on every job on this
#      runner: stray sims shut down before, all sims shut down + job sims deleted after, even on cancel/timeout;
#      jobs refused below the 25 GB floor) and a launchd sweep every 30 min for sims booted outside Actions
#   3. full cleanup (unavailable sims, duplicate runtimes, DerivedData, caches, runner temp/old logs); fails loudly
#      if free space stays under the floor.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/mac-runner-hygiene.yml
      - .github/mac-runner/**
permissions:
  contents: read
concurrency:
  group: mac-runner-hygiene
  cancel-in-progress: false
jobs:
  hygiene:
    runs-on: [self-hosted, ios-sim]
    timeout-minutes: 20
    env:
      MIN_FREE_GB: "25"
    steps:
      - name: Emergency cleanup before checkout
        shell: bash
        run: |
          echo "free before: $(df -g /System/Volumes/Data | awk 'NR==2{print $4}') GB"
          xcrun simctl shutdown all || true
          xcrun simctl delete unavailable || true
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData/"* "$HOME/Library/Developer/CoreSimulator/Caches/"* 2>/dev/null || true
          echo "free after emergency step: $(df -g /System/Volumes/Data | awk 'NR==2{print $4}') GB"
      # Persistent workspace + dangling gitlink (august-industries-site): skip clean + submodules.
      - uses: actions/checkout@v4
        with:
          clean: false
          submodules: false
          sparse-checkout: .github/mac-runner
      - name: Install/refresh runner hooks + launchd sweep
        shell: bash
        run: bash .github/mac-runner/install.sh
      - name: Full cleanup; fail if free space stays under the floor
        shell: bash
        run: |
          before=$(df -g /System/Volumes/Data | awk 'NR==2{print $4}')
          bash "$HOME/aos-mac-hygiene/sim-guard.sh" clean; rc=$?
          after=$(df -g /System/Volumes/Data | awk 'NR==2{print $4}')
          echo "mac-runner-hygiene: free ${before} GB -> ${after} GB (floor ${MIN_FREE_GB} GB)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
