name: SnapScore offline compile diagnostic
# Selected QA ref only; never merge this replacement into main.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: snapscore-private-android-compile
  cancel-in-progress: false
jobs:
  compile-only:
    if: github.repository == 'augsmog/QuickScore' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qa/snapscore-main-android-compile'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile immutable offline fixture and print bounded receipt
        run: python3 -B scoresnap/e2e/device-layout/scripts/checkpoint/compile_only.py
