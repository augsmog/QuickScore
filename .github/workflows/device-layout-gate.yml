name: device-layout-gate
# AUG-1380 (child of AUG-1373). Cross-device usability + visual layout gate for SnapScore UI
# PRs. ALWAYS STARTS (no workflow-level path filter — those leave required checks stuck
# "Expected"/pending). Path logic lives INSIDE the `changes` job: UI-affecting changes run the
# full gate; doc-only changes emit an explicit successful exemption. See
# /workspace/aos-state/reports/2026-11-19-device-gate-t1547u/RECONCILED-PLAN.md sections B–E.
#
# Layers:
#   1. deterministic  — rules 1–8 geometry engine + fixture/waiver integrity (fast, free).
#   2. vision-selfcheck — rubric-drift self-check: the committed owner negative fixtures MUST
#                         come back flagged (rule 2 footer-clip + rule-4/6 alignment family),
#                         or the gate fails itself.
#   3. android-compact — Android compact AVD (360x800dp, API 35) on ubuntu-latest KVM, Maestro
#                        device-layout flows → geometry runner (AUG-1376 native harness).
#   4. ios-sim         — iPhone 16 Pro + iPhone SE 3 on the self-hosted Mac mini (AUG-1376).
#   5. vision-candidate — cross-company (Codex astra/high) review of this build's screenshots.
#
# Making this a REQUIRED merge-blocking check (branch protection on augsmog/QuickScore main +
# the safe_merge.py mandatory-named-check change) is an owner-approved control item, tracked in
# the RECONCILED-PLAN owner items. The workflow is the always-start half of that contract.
# AUG-1601 / AUG-1380 (owner decision, Nov 27 2026): MANUAL-ONLY. It runs when a lane starts it
# on a release candidate; nothing starts it on its own. It is therefore no longer an always-start
# check: if branch protection still lists it as required, that requirement must be removed by the
# owner or pull requests to main will wait on it forever.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Decide if this PR affects SnapScore UI
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.sha }}"
          if [ -z "$base" ]; then base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"; fi
          files="$(git diff --name-only "$base" "$head" || true)"
          echo "changed files:"; echo "$files"
          # UI-affecting: app routes, shared UI/theme/assets, native/config/deps, flows, the gate
          # itself, and the device-layout module. Unknown-impact (non doc-only) runs the gate.
          ui=false
          native=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              scoresnap/app/**|scoresnap/src/ui/**|scoresnap/src/**/*.tsx|scoresnap/assets/**|\
              scoresnap/app.json|scoresnap/app.config.*|scoresnap/package.json|scoresnap/package-lock.json|\
              .maestro/**)
                ui=true; native=true ;;  # app UI: full native evidence on BOTH platforms (owner card t1550s9640)
              scoresnap/e2e/device-layout/**|.github/workflows/device-layout-gate.yml)
                ui=true ;;  # the gate's own code: layers 1-2 (unit tests + rubric self-check)
              .github/mac-runner/*|.github/workflows/mac-runner-hygiene.yml|.github/workflows/mac-runner-watch.yml)
                : ;;  # Mac runner hygiene (AUG-1484): runner ops, not app UI
              *.md|docs/**|**/*.md|LICENSE|.gitignore)
                : ;;  # doc-only candidate
              *)
                ui=true; native=true ;;  # unknown impact → run the full gate (fail safe)
            esac
          done <<< "$files"
          # A manual run is someone asking for the gate on this commit: run all of it, whatever the
          # last commit happened to touch.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ui=true; native=true; fi
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"
          if [ "$ui" = "false" ]; then
            echo "Doc-only change — device-layout gate exempt (explicit success)."
          fi

  deterministic:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scoresnap/e2e/device-layout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Layer 1 — deterministic geometry rules 1–8 + fixtures + waivers (unit tests)
        if: needs.changes.outputs.ui == 'true'
        run: node --test lib/*.test.mjs
      - name: Validate committed waivers.json
        if: needs.changes.outputs.ui == 'true'
        run: node -e "import('./lib/waivers.mjs').then(m=>{const d=JSON.parse(require('fs').readFileSync('waivers.json'));const r=m.validateWaivers(d);if(!r.ok){console.error(r.errors.join('\n'));process.exit(1)}console.log('waivers ok')})"
      - name: Doc-only exemption
        if: needs.changes.outputs.ui != 'true'
        run: echo "Doc-only change — deterministic layer skipped by design (exempt success)."

  vision-selfcheck:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scoresnap/e2e/device-layout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Layer 2 — rubric-drift self-check against committed owner negative fixtures
        if: needs.changes.outputs.ui == 'true'
        # Uses the committed Codex astra/high calibration reviews (reproduced run, no API/spend).
        # When the live reviewer is wired into CI (owner item: credentials), swap --reviews for
        #   --review-cmd "$DEVICE_LAYOUT_VISION_CMD" to produce reviews fresh each run.
        run: node run-vision.mjs --self-check --reviews fixtures/negative/calibration
      - name: Doc-only exemption
        if: needs.changes.outputs.ui != 'true'
        run: echo "Doc-only change — vision self-check skipped by design (exempt success)."

  android-compact:
    needs: [changes, deterministic, vision-selfcheck]
    # Native layer for app-UI changes (native == true). Builds the debug APK from the exact
    # candidate SHA (Java 17 + npm ci), boots a compact AVD (ubuntu-latest KVM), drives the
    # Maestro device-layout capture flows → geometry runner. Fails loudly until the AUG-1376
    # harness lands. Owner card t1550s9640 (Nov 19 2026): both platforms, full native evidence.
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoresnap/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install app dependencies (npm ci, exact lockfile)
        run: npm ci --prefix scoresnap
      - name: Cache Gradle (warm reruns of the Android release build)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('scoresnap/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Enable KVM (hardware accel, ubuntu-latest, 1x quota)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_5
          # Compact custom AVD geometry (≈360x800dp @ 480dpi) is forced by the harness (wm density/size).
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            DEVICE_LAYOUT_OUT="${{ runner.temp }}/device-layout-out"
            DEVICE_LAYOUT_LARGE_TEXT=true
            bash scoresnap/e2e/device-layout/scripts/run-android-compact.sh
      - name: Upload Android capture bundle (candidate-bound; reviewed by vision-candidate)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-layout-android
          path: ${{ runner.temp }}/device-layout-out
          if-no-files-found: ignore
          retention-days: 14

  ios-sim:
    needs: [changes, deterministic, vision-selfcheck]
    # iOS rows on the self-hosted Mac mini runner (labels self-hosted, ios-sim), owner card t1550s9640.
    # Every PR: iPhone 16 Pro (402x874) + iPhone SE 3 (375x667); AX3 text when the run stays < 15 min.
    if: ${{ needs.changes.outputs.native == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, ios-sim]
    # Target is both profiles <= 25 min on a warm Mac (parallel sims + in-flow screenshot lift, see
    # run-ios-sim.sh). Cap raised 45→60 as a safety net while the per-phase timings from this run
    # confirm the real cost; it is a ceiling, not the expected wall time (AUG-1376 round 2).
    timeout-minutes: 60
    # GB of free disk this job needs on the Mac. Empty = not measured yet: record, never fail.
    env:
      NEED_GB: ""
    steps:
      # AUG-1601 safety step. It records free disk on the Mac and fails only when NEED_GB is set and
      # less than that is free. NEED_GB is unset until a real build has been measured: record only.
      - name: "Disk need (AUG-1601): record free GB; fail only if below NEED_GB"
        shell: bash
        run: |
          vol=/System/Volumes/Data; [ -d "$vol" ] || vol=/
          free=$(df -g "$vol" | awk 'NR==2 {print $4}')
          echo "disk before: ${free} GB free on $vol; NEED_GB=${NEED_GB:-unset}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "${NEED_GB:-}" ] && [ "$free" -lt "$NEED_GB" ]; then
            echo "::error::Mac disk: ${free} GB free is less than the ${NEED_GB} GB this job needs."
            exit 1
          fi
      # Self-hosted Mac mini has a persistent workspace. The repo carries a dangling gitlink
      # (`august-industries-site`, mode 160000, no .gitmodules entry), so checkout's default clean /
      # submodule phase fails ("no submodule mapping found") and recreates the workspace from scratch
      # (~7 min/run). Skip clean + submodules to keep the warm workspace; `expo prebuild --clean`
      # regenerates ios/ anyway. (The gitlink itself is a repo defect — see AUG-1376 report; removing
      # it with `git rm --cached` needs owner approval and is not done here.)
      - uses: actions/checkout@v4
        with:
          clean: false
          submodules: false
      - name: iOS simulator legs (iPhone 16 Pro, iPhone SE 3)
        env:
          DEVICE_LAYOUT_IOS_PROFILES: iphone-16-pro,iphone-se-3
          # Owner decision t1557u (Nov 20 2026): iphone-se-3 is NOT launch-blocking until 1.0.2 —
          # still captured, scored and printed to the job summary, but it does not fail the required
          # device-layout-gate. Launch-blocking iOS profile: iphone-16-pro (+ android-compact 1.0/1.3).
          DEVICE_LAYOUT_REPORT_ONLY_PROFILES: iphone-se-3
          DEVICE_LAYOUT_OUT: ${{ runner.temp }}/device-layout-out
          DEVICE_LAYOUT_LARGE_TEXT: "true"
        run: |
          rm -rf "$DEVICE_LAYOUT_OUT"
          bash scoresnap/e2e/device-layout/scripts/run-ios-sim.sh
      - name: Upload iOS capture bundles (candidate-bound; reviewed by vision-candidate)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-layout-ios
          path: ${{ runner.temp }}/device-layout-out
          if-no-files-found: ignore
          retention-days: 14
      - name: "Disk need (AUG-1601): record free GB after the job"
        if: always()
        shell: bash
        run: |
          vol=/System/Volumes/Data; [ -d "$vol" ] || vol=/
          echo "disk after: $(df -g "$vol" | awk 'NR==2 {print $4}') GB free on $vol" | tee -a "$GITHUB_STEP_SUMMARY"

  vision-candidate:
    needs: [changes, android-compact, ios-sim]
    # Layer 2 on the CANDIDATE (Codex check 7116885 finding 3): the cross-company vision reviewer
    # judges every native checkpoint screenshot of this exact build (sha256-bound), after a fresh
    # live rubric self-check on the owner negative fixtures with the same reviewer. Runs on the
    # Mac runner, where the reviewer command (DEVICE_LAYOUT_VISION_CMD) is configured runner-side;
    # no model credentials live in GitHub. Unset reviewer or missing bundles => FAIL (fail closed).
    if: ${{ !cancelled() && needs.changes.outputs.native == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, ios-sim]
    timeout-minutes: 30
    # GB of free disk this job needs on the Mac. Empty = not measured yet: record, never fail.
    env:
      NEED_GB: ""
    steps:
      # AUG-1601 safety step. It records free disk on the Mac and fails only when NEED_GB is set and
      # less than that is free. NEED_GB is unset until a real build has been measured: record only.
      - name: "Disk need (AUG-1601): record free GB; fail only if below NEED_GB"
        shell: bash
        run: |
          vol=/System/Volumes/Data; [ -d "$vol" ] || vol=/
          free=$(df -g "$vol" | awk 'NR==2 {print $4}')
          echo "disk before: ${free} GB free on $vol; NEED_GB=${NEED_GB:-unset}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "${NEED_GB:-}" ] && [ "$free" -lt "$NEED_GB" ]; then
            echo "::error::Mac disk: ${free} GB free is less than the ${NEED_GB} GB this job needs."
            exit 1
          fi
      # Same persistent-workspace / dangling-gitlink caveat as the ios-sim job above.
      - uses: actions/checkout@v4
        with:
          clean: false
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          pattern: device-layout-*
          path: ${{ runner.temp }}/device-layout-candidate
      - name: Candidate vision review (all native bundles, both platforms)
        # iphone-se-3 vision findings are produced and printed to the summary but do not block the
        # required gate until 1.0.2 (owner t1557u); iphone-16-pro + android-compact stay blocking.
        env:
          DEVICE_LAYOUT_REPORT_ONLY_PROFILES: iphone-se-3
        run: bash scoresnap/e2e/device-layout/scripts/run-vision-candidate.sh "${{ runner.temp }}/device-layout-candidate"
      - name: "Disk need (AUG-1601): record free GB after the job"
        if: always()
        shell: bash
        run: |
          vol=/System/Volumes/Data; [ -d "$vol" ] || vol=/
          echo "disk after: $(df -g "$vol" | awk 'NR==2 {print $4}') GB free on $vol" | tee -a "$GITHUB_STEP_SUMMARY"

  device-layout-gate:
    # The ONE aggregate status check. Its name is the contract: branch protection on main and
    # augie-os-control safe_merge.py both require a check named exactly `device-layout-gate`.
    # Always runs and always reports, so doc-only PRs are not blocked.
    if: always()
    needs: [changes, deterministic, vision-selfcheck, android-compact, ios-sim, vision-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate verdict
        env:
          UI: ${{ needs.changes.outputs.ui }}
          NATIVE: ${{ needs.changes.outputs.native }}
          R_CHANGES: ${{ needs.changes.result }}
          R_DET: ${{ needs.deterministic.result }}
          R_VIS: ${{ needs.vision-selfcheck.result }}
          R_AND: ${{ needs.android-compact.result }}
          R_IOS: ${{ needs.ios-sim.result }}
          R_VCAND: ${{ needs.vision-candidate.result }}
        run: |
          set -u
          echo "changes=$R_CHANGES deterministic=$R_DET vision-selfcheck=$R_VIS android-compact=$R_AND ios-sim=$R_IOS vision-candidate=$R_VCAND ui=$UI native=$NATIVE"
          [ "$R_CHANGES" = success ] || { echo "::error::changes job $R_CHANGES"; exit 1; }
          if [ "$UI" != true ]; then echo "Doc-only change: exempt (success)."; exit 0; fi
          { [ "$R_DET" = success ] && [ "$R_VIS" = success ]; } || { echo "::error::layer 1/2 not green"; exit 1; }
          if [ "$NATIVE" = true ]; then
            [ "$R_AND" = success ] || { echo "::error::Android native leg $R_AND (full native evidence required)"; exit 1; }
            [ "$R_IOS" = success ] || { echo "::error::iOS native leg $R_IOS (full native evidence required)"; exit 1; }
            [ "$R_VCAND" = success ] || { echo "::error::candidate vision review $R_VCAND (cross-company review of this build's screenshots required)"; exit 1; }
          fi
          echo "device-layout-gate: PASS"
