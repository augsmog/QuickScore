name: device-layout-gate
# Selected-ref, one-shot diagnostic only. Never merge this workflow into main.
on:
  workflow_dispatch:
permissions: {}
jobs:
  read-only-metadata-admission:
    if: github.repository == 'augsmog/QuickScore' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qa/snapscore-android-admission-metadata'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Read official metadata and existing local capabilities only
        if: runner.environment == 'github-hosted' && runner.os == 'Linux' && runner.arch == 'X64'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(id -u)" != 0
          work="$(mktemp -d "${RUNNER_TEMP}/android-admission-source.XXXXXXXX")"
          trap 'rm -f -- "$work/probe.py"; rmdir -- "$work"' EXIT
          cat > "$work/probe.py" <<'READ_ONLY_PY'
          """Only GET exact Google repository metadata and read local capability attributes."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess
          import tempfile
          import xml.etree.ElementTree as ET

          ORIGIN = "https://dl.google.com"
          INDEXES = {
              "api35": ("/android/repository/sys-img/android/sys-img2-1.xml",
                        "sdk-sys-img", "http://schemas.android.com/sdk/android/repo/sys-img2/01",
                        "system-images;android-35;default;x86_64"),
              "platformTools": ("/android/repository/repository2-3.xml",
                                "sdk-repository", "http://schemas.android.com/sdk/android/repo/repository2/03",
                                "platform-tools"),
          }
          CAP = 16 * 1024 * 1024
          PATH = "/usr/bin:/bin"
          BASE_ENV = {"PATH": PATH, "LC_ALL": "C", "LANG": "C"}
          TARGET = (37, 0, 1)


          class Held(Exception):
              pass


          def require(ok, code):
              if not ok:
                  raise Held(code)


          def fields(e, name, optional=False):
              rows = [x for x in e if x.tag == name]
              require(len(rows) <= 1 and (optional or len(rows) == 1), "XML_FIELD_" + name)
              return rows[0] if rows else None


          def val(e, name, optional=False):
              row = fields(e, name, optional)
              if row is None:
                  return None
              raw = row.text or ""
              require(len(row) == 0 and 0 < len(raw.strip()) <= 255, "XML_TEXT_" + name)
              return raw.strip()


          def integer(v, cap=100000):
              require(isinstance(v, str) and re.fullmatch(r"[0-9]{1,12}", v) is not None and int(v) <= cap, "XML_INTEGER")
              return int(v)


          def parse(key, raw):
              path, name, ns, pkg = INDEXES[key]
              require(0 < len(raw) <= CAP, "REPOSITORY_METADATA_SIZE")
              # Never permit DTD/entity declarations, non-UTF-8 or a UTF-16/NUL trick.
              text = raw.decode("utf-8-sig", "strict")
              require("\0" not in text and not re.search(r"<!\s*(?:DOCTYPE|ENTITY)\b", text, re.I),
                      "UNSAFE_XML_DECLARATION")
              root = ET.fromstring(text)
              require(root.tag == "{{{}}}{}".format(ns, name), "REPOSITORY_NAMESPACE")
              out = []
              for remote in root.findall("remotePackage"):
                  if remote.get("path") != pkg:
                      continue
                  channel = fields(remote, "channelRef", True)
                  if channel is not None and channel.get("ref") != "channel-0":
                      continue
                  rev = fields(remote, "revision")
                  if fields(rev, "preview", True) is not None:
                      continue
                  v = (integer(val(rev, "major")), integer(val(rev, "minor", True) or "0"),
                       integer(val(rev, "micro", True) or "0"))
                  require(v[0] > 0, "INVALID_MAJOR")
                  if key == "api35":
                      details = fields(remote, "type-details")
                      require(val(details, "api-level") == "35" and val(details, "abi") == "x86_64" and
                              val(fields(details, "tag"), "id") == "default", "WRONG_API35_ABI_OR_VARIANT")
                  for archive in fields(remote, "archives").findall("archive"):
                      os_name = val(archive, "host-os", True)
                      arch = val(archive, "host-arch", True)
                      if key == "platformTools" and os_name != "linux":
                          continue
                      if key == "api35" and os_name not in (None, "linux"):
                          continue
                      if arch not in (None, "x64", "x86_64"):
                          continue
                      body = fields(archive, "complete")
                      size = integer(val(body, "size"), cap=15_000_000_000)
                      filename = val(body, "url")
                      require(size > 0 and re.fullmatch(r"[A-Za-z0-9_.-]{1,160}\.zip", filename)
                              and not filename.startswith((".", "-")), "UNSAFE_ARCHIVE_LOCATOR")
                      checks = {}
                      for e in body.findall("checksum"):
                          method = e.get("type", "sha1")
                          n = {"sha1":40, "sha256":64}.get(method)
                          value = (e.text or "").strip()
                          require(n is not None and method not in checks and not len(e) and
                                  re.fullmatch("[a-fA-F0-9]{" + str(n) + "}", value), "INVALID_PUBLISHER_CHECKSUM")
                          checks[method] = value.lower()
                      require(bool(checks), "PUBLISHER_CHECKSUM_MISSING")
                      lic = fields(remote, "uses-license", True)
                      license_id = lic.get("ref") if lic is not None else None
                      require(license_id is None or re.fullmatch(r"[a-z0-9-]{1,80}", license_id),
                              "INVALID_LICENSE_REF")
                      out.append({"revision":list(v), "url":ORIGIN + path.rsplit("/",1)[0]+"/"+filename,
                                  "archiveBytes":size, "publisherChecksum":checks, "licenseRef":license_id})
              require(0 < len(out) <= 10 and len({tuple(x["revision"]) for x in out}) == len(out),
                      "EXACT_STABLE_LINUX_ROW_MISSING_OR_AMBIGUOUS")
              return {"source":ORIGIN+path,"metadataBytes":len(raw),"metadataSha256":hashlib.sha256(raw).hexdigest(),
                      "package":pkg,"stablePublisherRows":sorted(out,key=lambda x:x["revision"],reverse=True)}


          def fetch(key, scratch):
              url = ORIGIN + INDEXES[key][0]
              target = scratch / (key + ".xml")
              # --disable must be first: do not read curlrc. No auth/proxy/redirect/archives.
              args = ["/usr/bin/curl","--disable","--silent","--show-error","--noproxy","*","--proto","=https",
                      "--tlsv1.2","--max-redirs","0","--connect-timeout","8","--max-time","24",
                      "--max-filesize",str(CAP),"--header","Accept: application/xml, text/xml",
                      "--output",str(target),"--write-out","%{http_code}\\n%{content_type}\\n%{url_effective}\\n",url]
              try:
                  p = subprocess.run(args, env=BASE_ENV, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=27)
              except (subprocess.TimeoutExpired, OSError):
                  raise Held("DIRECT_GOOGLE_TLS_UNAVAILABLE") from None
              require(p.returncode == 0 and len(p.stdout) <= 1024, "DIRECT_GOOGLE_TLS_UNAVAILABLE")
              report = p.stdout.decode("utf-8").splitlines()
              require(len(report) == 3 and report[0] == "200" and report[2] == url
                      and report[1].split(";",1)[0].strip().lower() in ("application/xml","text/xml"),
                      "DIRECT_GOOGLE_HTTP_STATUS_TYPE_OR_ORIGIN")
              with target.open("rb") as f:
                  return f.read(CAP+1)


          def local_docker(scratch):
              socket = Path("/var/run/docker.sock")
              try:
                  # lstat rejects unexpected symlink endpoints; normal /var/run directory alias is fine.
                  if not stat.S_ISSOCK(socket.lstat().st_mode):
                      return {"available":False,"reason":"EXPECTED_LOCAL_SOCKET_NOT_PRESENT"}
                  config = scratch/"docker-empty"
                  config.mkdir(mode=0o700)
                  p = subprocess.run(["/usr/bin/docker","--config",str(config),"-H","unix:///var/run/docker.sock",
                                      "version","--format","{{json .}}"], env={**BASE_ENV,"HOME":str(config)},
                                     stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=8)
                  if p.returncode or len(p.stdout)>32768:
                      return {"available":False,"reason":"LOCAL_DAEMON_VERSION_UNAVAILABLE"}
                  data = json.loads(p.stdout)
                  client, server = data["Client"], data["Server"]
                  vc, vs = client["Version"], server["Version"]
                  require(all(re.fullmatch(r"[0-9]{1,3}(?:\.[0-9]{1,3}){1,3}(?:[-+.][A-Za-z0-9.-]{1,35})?",x)
                              for x in (vc,vs)), "DOCKER_VERSION_INVALID")
                  require(server["Os"] == "linux" and server["Arch"] in ("amd64","x86_64"), "DAEMON_NOT_LINUX_X64")
                  return {"available":True,"clientVersion":vc,"serverVersion":vs,"serverOs":"linux","serverArch":server["Arch"]}
              except (Held, OSError, ValueError, TypeError, KeyError, subprocess.TimeoutExpired):
                  return {"available":False,"reason":"LOCAL_DAEMON_VERSION_UNVERIFIED"}


          def kvm():
              p = "/dev/kvm"
              try:
                  s = os.stat(p, follow_symlinks=False)
                  require(stat.S_ISCHR(s.st_mode) and (os.major(s.st_rdev),os.minor(s.st_rdev)) == (10,232),
                          "WRONG_KVM_NODE_TYPE")
                  a = lambda mode: os.access(p,mode,effective_ids=True,follow_symlinks=False)
                  return {"nodePresent":True,"major":10,"minor":232,"currentUserCanRead":a(os.R_OK),
                          "currentUserCanWrite":a(os.W_OK),"primaryDeviceGroup":s.st_gid == os.getegid(),
                          "supplementalDeviceGroup":s.st_gid in os.getgroups(),"currentUserNonRoot":os.geteuid()!=0}
              except (Held,OSError,NotImplementedError):
                  return {"nodePresent":False,"reason":"EXPECTED_KVM_NODE_UNAVAILABLE_OR_WRONG_TYPE"}


          def main():
              receipts = {}
              with tempfile.TemporaryDirectory(prefix="android-admission-") as directory:
                  scratch = Path(directory)
                  for key in INDEXES:
                      try:
                          receipts[key] = parse(key, fetch(key, scratch))
                      except (Held, OSError, UnicodeError, ET.ParseError) as er:
                          receipts[key] = {"blocked":str(er) if isinstance(er,Held) else "REPOSITORY_XML_INVALID"}
                  docker = local_docker(scratch)
              rows = receipts["platformTools"].get("stablePublisherRows",[])
              seen = any(tuple(r["revision"]) == TARGET for r in rows)
              result = {"scope":"metadata-and-host-capability-readback-only","metadata":receipts,
                        "preferredPlatformTools37_0_1Present":seen,"docker":docker,"kvm":kvm(),
                        "notRuntimeProof":True,"appOperations":False,"containerOperations":False,
                        "archiveDownloads":False,"pixelDispatchAuthorized":False}
              print(json.dumps(result,sort_keys=True))
              # This must never look like the merge-blocking device layout gate passed.
              return 78


          if __name__ == "__main__":
              raise SystemExit(main())
          READ_ONLY_PY
          printf '%s  %s\n' 3b67ad93cc2b7eda51f3830fea877862f438a31de0876bc1427ec85765ed3f51 "$work/probe.py" | /usr/bin/sha256sum --check --status
          /usr/bin/env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C TMPDIR="$work" /usr/bin/python3 -I -B "$work/probe.py"
