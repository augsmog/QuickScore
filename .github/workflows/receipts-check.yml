name: Receipt report check
on:
  pull_request:
    paths:
      - 'reports/**'
permissions:
  contents: read
jobs:
  receipts-check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate changed receipt reports
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA...$HEAD_SHA" -- ':(glob)reports/**/*.md')
          if ((${#files[@]} == 0)); then
            echo 'No changed reports/**/*.md files found.'
            exit 1
          fi
          node scoresnap/scripts/ci/check-receipt.mjs "${files[@]}"
