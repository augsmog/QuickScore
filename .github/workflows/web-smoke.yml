name: Web smoke
on:
  push:
    branches: [main]
  # CI trim 2026-10-30 (Augie yes 4:21 PM PT): PRs run this suite only when files it tests change.
  # Main pushes and manual runs are unfiltered.
  pull_request:
    paths:
      - 'scoresnap/**'
      - 'GAMES_STATUS.md'
      - 'docs/xdevice/**'
      - '.github/workflows/web-smoke.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: scoresnap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoresnap/package-lock.json
      - run: npm ci
      - run: node --test e2e/usability-gate.test.mjs
      - run: npm test -- --runInBand
      - run: EXPO_PUBLIC_OFFLINE_MODE=true npx expo export --platform web --output-dir dist-web
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: |
          node e2e/serve.mjs > /tmp/web-smoke-server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8089/ > /dev/null; then break; fi
            sleep 1
          done
          kill -0 "$SERVER_PID"
          curl --fail --silent http://127.0.0.1:8089/ > /dev/null
          EXPECT_CROSS_DEVICE_SHARING=false BASE_URL=http://127.0.0.1:8089 OUT_DIR=e2e/screens node e2e/web-real-flow.mjs
          BASE_URL=http://127.0.0.1:8089 node e2e/live-share.mjs
      - name: Join gate (sharing off and game sheet)
        run: EXPECT_CROSS_DEVICE_SHARING=false BASE_URL=http://127.0.0.1:8089 node e2e/join-gate.mjs
      - name: Browser smoke (cross-device sharing flag on, guest join flow)
        run: |
          EXPO_PUBLIC_FEATURE_CROSS_DEVICE_SHARING=true EXPO_PUBLIC_OFFLINE_MODE=true npx expo export --platform web --output-dir dist-web-sharing --clear
          WEB_ROOT=dist-web-sharing PORT=8092 node e2e/serve.mjs > /tmp/sharing-server.log 2>&1 &
          SHARING_SERVER_PID=$!
          echo "SHARING_SERVER_PID=$SHARING_SERVER_PID" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8092/ > /dev/null; then break; fi
            sleep 1
          done
          kill -0 "$SHARING_SERVER_PID"
          curl --fail --silent http://127.0.0.1:8092/ > /dev/null
          EXPECT_CROSS_DEVICE_SHARING=true BASE_URL=http://127.0.0.1:8092 OUT_DIR=e2e/screens/sharing-on node e2e/web-real-flow.mjs
      - name: Join gate (sharing on)
        run: EXPECT_CROSS_DEVICE_SHARING=true BASE_URL=http://127.0.0.1:8092 node e2e/join-gate.mjs
      - name: Usability (required cases, no skips)
        run: BASE_URL=http://127.0.0.1:8092 node e2e/usability.mjs
      - name: Safe-area sheets (iPhone Dynamic Island, 59px top / 34px bottom)
        run: BASE_URL=http://127.0.0.1:8089 node e2e/safe-area-sheets.mjs
      - name: Missing-dismiss regression proof
        run: BASE_URL=http://127.0.0.1:8092 node e2e/usability-regression.mjs
      - name: Journey budgets and reachability
        timeout-minutes: 2
        run: |
          node --test e2e/journeys/metrics.test.mjs e2e/journeys/glyph-evidence.test.mjs e2e/journeys/glyph-evidence.browser.test.mjs
          BASE_URL=http://127.0.0.1:8092 OUT_DIR=e2e/journey-screens node e2e/journeys/runner.mjs
          BASE_URL=http://127.0.0.1:8092 OUT_DIR=e2e/journey-screens/negative-proof node e2e/journeys/negative-proof.mjs
      - name: Upload journey screenshots
        uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 1
        with:
          name: journey-screens
          path: scoresnap/e2e/journey-screens
          retention-days: 7
      - name: Browser matrix
        run: BASE_URL=http://127.0.0.1:8089 OUT_DIR=e2e/screens/matrix npm run e2e:matrix -- --retries=1
      - name: Render scorecard screenshot
        run: |
          EXPO_PUBLIC_DEMO_MODE=true EXPO_PUBLIC_OFFLINE_MODE=true npx expo export --platform web --output-dir dist-web-scorecard --clear
          STANDARD_BUNDLE=$(find dist-web/_expo/static/js/web -name 'entry-*.js' -printf '%f\n')
          DEMO_BUNDLE=$(find dist-web-scorecard/_expo/static/js/web -name 'entry-*.js' -printf '%f\n')
          test -n "$STANDARD_BUNDLE" && test -n "$DEMO_BUNDLE"
          if [ "$DEMO_BUNDLE" = "$STANDARD_BUNDLE" ]; then
            echo "Demo bundle matches the standard bundle; demo mode was not inlined" >&2
            exit 1
          fi
          WEB_ROOT=dist-web-scorecard PORT=8090 node e2e/serve.mjs > /tmp/scorecard-server.log 2>&1 &
          SCREENSHOT_SERVER_PID=$!
          echo "SCREENSHOT_SERVER_PID=$SCREENSHOT_SERVER_PID" >> "$GITHUB_ENV"
          trap 'kill "$SCREENSHOT_SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8090/ > /dev/null; then break; fi
            sleep 1
          done
          kill -0 "$SCREENSHOT_SERVER_PID"
          curl --fail --silent http://127.0.0.1:8090/ > /dev/null
          BASE_URL=http://127.0.0.1:8090 node scripts/render-scorecard.mjs e2e/screens/scorecard-390x844.png
          kill "$SCREENSHOT_SERVER_PID" || true
      - name: Stop web server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then kill "$SERVER_PID" || true; fi
          if [ -n "$SHARING_SERVER_PID" ]; then kill "$SHARING_SERVER_PID" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-smoke-screens
          path: scoresnap/e2e/screens
