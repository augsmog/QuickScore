name: Web smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: scoresnap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scoresnap/package-lock.json
      - run: npm ci
      - run: node --test e2e/usability-gate.test.mjs
      - run: npm test -- --runInBand
      - run: EXPO_PUBLIC_OFFLINE_MODE=true npx expo export --platform web --output-dir dist-web
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: |
          node e2e/serve.mjs > /tmp/web-smoke-server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8089/ > /dev/null; then break; fi
            sleep 1
          done
          kill -0 "$SERVER_PID"
          curl --fail --silent http://127.0.0.1:8089/ > /dev/null
          BASE_URL=http://127.0.0.1:8089 OUT_DIR=e2e/screens node e2e/web-real-flow.mjs
          BASE_URL=http://127.0.0.1:8089 node e2e/live-share.mjs
      - name: Usability (required cases, no skips)
        run: BASE_URL=http://127.0.0.1:8089 node e2e/usability.mjs
      - name: Missing-dismiss regression proof
        run: BASE_URL=http://127.0.0.1:8089 node e2e/usability-regression.mjs
      - name: Browser matrix
        run: BASE_URL=http://127.0.0.1:8089 OUT_DIR=e2e/screens/matrix npm run e2e:matrix -- --retries=1
      - name: Stop web server
        if: always()
        run: if [ -n "$SERVER_PID" ]; then kill "$SERVER_PID" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-smoke-screens
          path: scoresnap/e2e/screens
