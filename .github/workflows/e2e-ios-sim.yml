name: E2E iOS simulator
# Runs .maestro flows (aos-e2e/v1) against an EAS iOS simulator build on a GitHub-hosted macOS runner.
# Manual only. No secrets used. Evidence: artifact e2e-<product>-<run_id> (manifest.json + screenshots).
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "EAS simulator build artifact URL (.tar.gz)"
        required: true
      build:
        description: "Build key from .maestro/e2e.config.json (online | offline)"
        required: true
        default: offline
      flows:
        description: "Comma-separated flow ids, or all"
        required: true
        default: all
      eas_build_id:
        description: "EAS build id (recorded in manifest)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: e2e-ios-sim-${{ github.ref }}-${{ inputs.build }}
  cancel-in-progress: false
jobs:
  maestro:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      APP_URL: ${{ inputs.app_url }}
      BUILD_KEY: ${{ inputs.build }}
      FLOWS: ${{ inputs.flows }}
      EAS_BUILD_ID: ${{ inputs.eas_build_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Validate inputs
        run: |
          case "$APP_URL" in https://expo.dev/artifacts/eas/*|https://*.expo.dev/*) ;; *) echo "app_url must be an EAS artifact URL"; exit 1;; esac
          case "$BUILD_KEY" in online|offline) ;; *) echo "bad build key"; exit 1;; esac
          echo "$FLOWS" | grep -Eq '^(all|[a-z0-9,-]+)$' || { echo "bad flows"; exit 1; }
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run flows
        run: .maestro/scripts/run-ios-sim.sh --app-url "$APP_URL" --build "$BUILD_KEY" --flows "$FLOWS" --build-id "$EAS_BUILD_ID" --out e2e-out
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-snapscore-${{ github.run_id }}
          path: e2e-out
          retention-days: 7
          if-no-files-found: warn
