name: E2E iOS simulator capacity readback
on:
  workflow_dispatch:
permissions: {}
jobs:
  capacity:
    if: github.repository == 'augsmog/QuickScore' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qa/snapscore-a073-hosted-capacity'
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Read installed host capacity only
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os, pathlib, platform, re, shutil, subprocess
          def read(args):
              try:
                  r = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=10, env={k: os.environ[k] for k in ('PATH', 'HOME', 'TMPDIR') if k in os.environ})
                  if r.returncode or len(r.stdout) + len(r.stderr) > 2000000:
                      return None
                  return (r.stdout + r.stderr).decode('utf-8', 'strict').strip()
              except (OSError, subprocess.TimeoutExpired, UnicodeError):
                  return None
          def version(text, pattern):
              if text is None:
                  return None
              m = re.search(pattern, text)
              return m.group(1) if m else None
          expected = {'GITHUB_REPOSITORY': 'augsmog/QuickScore', 'GITHUB_EVENT_NAME': 'workflow_dispatch', 'GITHUB_REF': 'refs/heads/qa/snapscore-a073-hosted-capacity', 'RUNNER_ENVIRONMENT': 'github-hosted', 'RUNNER_OS': 'macOS', 'RUNNER_ARCH': 'ARM64'}
          if any(os.environ.get(k) != v for k, v in expected.items()) or platform.system() != 'Darwin' or platform.machine() != 'arm64':
              print('{"status":"BLOCKED","reason":"HOST_CONTEXT_MISMATCH"}')
              raise SystemExit(78)
          receipt = {'schema': 1, 'scope': 'installed-host-readback-only', 'budgetPass': None, 'nativeProof': False}
          ram = read(['/usr/sbin/sysctl', '-n', 'hw.memsize'])
          receipt['physicalRamBytes'] = int(ram) if ram and re.fullmatch(r'[0-9]{1,20}', ram) else None
          groups = {}
          def volume(value):
              if not value:
                  return {'status': 'UNAVAILABLE'}
              p = pathlib.Path(value)
              if not p.is_absolute():
                  return {'status': 'UNAVAILABLE'}
              exact = p.exists()
              while not p.exists() and p != p.parent:
                  p = p.parent
              try:
                  s = os.statvfs(p)
                  device = p.stat().st_dev
                  group = groups.setdefault(device, len(groups) + 1)
                  return {'status': 'OBSERVED', 'requestedDirectoryExists': exact, 'volumeGroup': group, 'availableBytes': s.f_bavail * s.f_frsize, 'freeBytes': s.f_bfree * s.f_frsize, 'totalBytes': s.f_blocks * s.f_frsize}
              except OSError:
                  return {'status': 'UNAVAILABLE'}
          receipt['volumes'] = {'runnerTemp': volume(os.environ.get('RUNNER_TEMP')), 'simulatorData': volume(str(pathlib.Path.home() / 'Library/Developer/CoreSimulator/Devices')), 'root': volume('/')}
          selected = read(['/usr/bin/xcode-select', '-p'])
          safe_path = selected if selected and re.fullmatch(r'/Applications/Xcode(?:_[0-9.]+)?\.app/Contents/Developer', selected) else None
          receipt['xcode'] = {'selectedAllowlistedPath': safe_path, 'exact2641PathPresent': pathlib.Path('/Applications/Xcode_26.4.1.app/Contents/Developer').is_dir(), 'version': version(read(['/usr/bin/xcodebuild', '-version']), r'Xcode ([0-9.]+)'), 'simulatorSdk': version(read(['/usr/bin/xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version']), r'^([0-9.]+)$')}
          def inventory(kind, key):
              raw = read(['/usr/bin/xcrun', 'simctl', 'list', kind, '--json'])
              try:
                  rows = json.loads(raw)[key]
                  return rows if isinstance(rows, list) and len(rows) <= 100 else None
              except (TypeError, ValueError, KeyError):
                  return None
          rows = inventory('runtimes', 'runtimes')
          receipt['iosRuntimes'] = None if rows is None else [{'identifier': r['identifier'], 'version': r.get('version') if re.fullmatch(r'[0-9.]{1,20}', str(r.get('version', ''))) else None, 'available': r.get('isAvailable') if type(r.get('isAvailable')) is bool else None} for r in rows if re.fullmatch(r'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]{1,20}', str(r.get('identifier', '')))]
          rows = inventory('devicetypes', 'devicetypes')
          receipt['iphone16ProTypeCount'] = None if rows is None else sum(r.get('identifier') == 'com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro' for r in rows)
          cache = pathlib.Path(os.environ.get('RUNNER_TOOL_CACHE', '/opt/hostedtoolcache'))
          nodes = []
          if cache.is_absolute():
              for arch in ('arm64', 'x64'):
                  node = cache / 'node/22.23.5' / arch / 'bin/node'
                  if node.is_file():
                      nodes.append({'cacheArchitecture': arch, 'version': version(read([str(node), '--version']), r'^(v[0-9.]+)$'), 'actualArchitecture': version(read([str(node), '-p', 'process.arch']), r'^(arm64|x64)$')})
          receipt['node22235Cache'] = nodes
          receipt['maestroOnPath'] = shutil.which('maestro') is not None
          tools = {}
          for name, args, pattern in [('psql', ['--version'], r'(?:PostgreSQL\)?\s+)([0-9.]+)'), ('java', ['-version'], r'version "([0-9._+]+)"'), ('zstd', ['--version'], r'v([0-9.]+)')]:
              path = shutil.which(name)
              tools[name] = {'present': path is not None, 'version': version(read([path, *args]), pattern) if path else None}
          tools['lsof'] = {'present': pathlib.Path('/usr/sbin/lsof').is_file(), 'version': version(read(['/usr/sbin/lsof', '-v']), r'revision:\s*([0-9.]+)')}
          receipt['tools'] = tools
          receipt['status'] = 'READBACK_COMPLETE'
          print(json.dumps(receipt, sort_keys=True, separators=(',', ':')))
          PY
