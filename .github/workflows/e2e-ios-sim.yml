name: E2E iOS simulator dual boot (Intel admission)
on:
  workflow_dispatch:
permissions: {}
jobs:
  dual_boot:
    if: github.repository == 'augsmog/QuickScore' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qa/snapscore-hosted-dual-boot-intel' && toJSON(github.event.repository.private) == 'false'
    runs-on: macos-26-intel
    timeout-minutes: 8
    steps:
      - name: Read two exact QA blobs without checking out unrelated gitlinks
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_COUNT: '0'
          GIT_TERMINAL_PROMPT: '0'
          GIT_ALLOW_PROTOCOL: https
        run: |
          set -euo pipefail
          umask 077
          if [[ "${RUNNER_ENVIRONMENT:-}" != github-hosted || "${RUNNER_OS:-}" != macOS || "${RUNNER_ARCH:-}" != X64 ]]; then
            echo '{"status":"BLOCKED","primaryFailure":{"stage":"host-context","code":"HOST_CONTEXT"},"nativeAppProof":false}'
            exit 78
          fi
          started_ns="$(python3 -I -S -c 'from time import monotonic_ns; print(monotonic_ns())')"
          [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          unset GIT_CONFIG_PARAMETERS
          scratch="$(mktemp -d "${RUNNER_TEMP:?}/snapscore-dual-source.XXXXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          db="$scratch/object-db"
          git init -q --bare --template= "$db"
          g() { git --git-dir="$db" "$@"; }
          g -c credential.helper= -c submodule.recurse=false fetch -q --depth=1 --no-tags --no-recurse-submodules https://github.com/augsmog/QuickScore.git "$GITHUB_SHA"
          [[ "$(g rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]]
          for file in run.py two_iphone_preflight.py; do
            path="qa/hosted-dual-boot/$file"
            blob="$(g rev-parse "$GITHUB_SHA:$path")"
            case "$file" in
              run.py) expected=ce5822862a8afa4a2460d6a0374b586a7c84c756 ;;
              two_iphone_preflight.py) expected=6af93496bc7e93175a32ff9f66fd19de099469f7 ;;
            esac
            [[ "$blob" == "$expected" ]]
            [[ "$(g ls-tree "$GITHUB_SHA" -- "$path")" == "100644 blob $blob"$'\t'"$path" ]]
            [[ "$(g cat-file -s "$blob")" -le 2097152 ]]
            g cat-file blob "$blob" > "$scratch/$file"
            [[ "$(g hash-object --no-filters "$scratch/$file")" == "$blob" ]]
          done
          SNAPSCORE_DUAL_BOOT_STARTED_NS="$started_ns" python3 -B "$scratch/run.py"
