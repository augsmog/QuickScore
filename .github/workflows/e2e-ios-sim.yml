name: E2E iOS simulator dual boot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dual_boot:
    if: github.repository == 'augsmog/QuickScore' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qa/snapscore-hosted-dual-boot-main'
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - name: Read dispatched QA source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Boot two owned disposable simulators and clean them
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
        run: |
          set -euo pipefail
          umask 077
          python3 -B qa/hosted-dual-boot/run.py
