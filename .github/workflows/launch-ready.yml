name: Launch readiness
on:
  pull_request:
    paths:
      - 'scoresnap/scripts/launch-ready/**'
      - 'scoresnap/docs/launch/evidence/launch-ready/**'
      - '.github/workflows/launch-ready.yml'
  push:
    branches: [main]
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: launch-ready-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5
      - name: Offline checker and reporting contracts
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          scoresnap/scripts/launch-ready/test_launch_ready_check.py
          scoresnap/scripts/launch-ready/test_launch_reporting.py
          --basetemp="${{ runner.temp }}/launch-ready-tests"
      - name: Missing check command must fail the gate
        env:
          RC_SHA: ${{ github.sha }}
        run: |
          set +e
          python scoresnap/scripts/launch-ready/run_launch_gate.py --rc-sha "$RC_SHA" --out-dir "$RUNNER_TEMP/launch-seed" --seed-missing-command
          status=$?
          set -e
          test "$status" -eq 1
          python -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/launch-seed/result.json")); assert r["configuration_errors"] and not r["ready"]'
  launch-gate:
    if: github.event_name != 'pull_request'
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect readbacks and evaluate exact source
        env:
          RC_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          AOS_EAS_BUILD_ID: ${{ vars.AOS_EAS_BUILD_ID }}
          ASC_BEARER_TOKEN: ${{ secrets.ASC_BEARER_TOKEN }}
          AOS_ASC_BUILD_ID: ${{ vars.AOS_ASC_BUILD_ID }}
        run: |
          args=()
          evidence=scoresnap/docs/launch/evidence/launch-ready/bundle.json
          if [ -f "$evidence" ]; then args+=(--evidence "$evidence"); fi
          python scoresnap/scripts/launch-ready/run_launch_gate.py --rc-sha "$RC_SHA" --out-dir "$RUNNER_TEMP/launch-ready" "${args[@]}"
      - name: Preserve failed and successful results for existing Tater daily consumer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-ready-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/launch-ready/
          if-no-files-found: error
          retention-days: 14
