name: Launch snapshot schema
on:
  # AUG-1601: manual-only. No push, pull_request, schedule or other automatic trigger may be added;
  # scoresnap/tests/workflow-triggers.test.cjs fails the unit suite if one is. Run with "Run workflow"
  # or `gh workflow run`.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch-snapshot-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate launch-readiness snapshot docs
        run: node --test scoresnap/scripts/ci/launch-snapshot-schema.node.cjs
