name: device-layout/v1 package
# AUG-1601: manual-only, like every workflow in this repository. It used to run on pull requests
# and pushes to main that touched packages/device-layout. Run it by hand after changing that package.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device-layout-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate shipped configs
        run: |
          node packages/device-layout/bin/device-layout.mjs validate --config packages/device-layout/configs/snapscore.device-layout.json
          node packages/device-layout/bin/device-layout.mjs validate --config packages/device-layout/configs/lrd.device-layout.json
      - name: Unit tests
        run: node --test packages/device-layout/test/*.test.mjs
