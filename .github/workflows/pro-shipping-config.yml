name: Pro shipping config guard
on:
  # AUG-1601: manual-only. No push, pull_request, schedule or other automatic trigger may be added;
  # scoresnap/tests/workflow-triggers.test.cjs fails the unit suite if one is. Run with "Run workflow"
  # or `gh workflow run`.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pro-shipping-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Pro-disabled shipping configuration
        run: node --test scoresnap/scripts/ci/pro-enabled-shipping-config.node.cjs
      - name: Verify workflow trigger contract
        run: node --test scoresnap/scripts/ci/pro-enabled-workflow-trigger.node.cjs
      - name: Validate store-capture config
        run: node --test scoresnap/e2e/store-capture/validate-capture.test.mjs scoresnap/e2e/store-capture/capture-runner.test.mjs
